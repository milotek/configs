/// SOUND STUFF ///

// Set volume of all played sounds.
snd_toolvolume 1.0

// Primary Fire
alias +skeet "+attack; play buttons/blip1; cl_crosshair_recoil 1; spec_next"
alias -skeet "-attack; cl_crosshair_recoil 1"
// bind "mouse1" "+skeet;"

// Secondary Fire
alias +skeet2 "+attack2; play buttons/blip1; spec_prev"
alias -skeet2 "-attack2"
// bind "mouse2" "+skeet2"

// Drop Current Weapon
alias "dropavppls" "drop; play sounds/diagnostics/impulse"
bind g "dropavppls"

//Inspect weapon
alias +swag "+lookatweapon; play buttons/button9"
alias -swag "-lookatweapon
bind f "+swag"

// Inspect Reload Loop
// alias +lookdrop "+reload;-attack;-attack2"
