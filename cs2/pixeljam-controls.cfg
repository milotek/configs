exec t1ckbase_rainbow_crosshair

// TESTING STUFF

// Bhop scroll wheel
// When holding ALT scroll wheel swaps to jumping/ducking
// When released swap back

alias "bhop_disable_jump" "bind mwheeldown invnext;play common/talk; fps_max 999"
alias "bhop_disable_duck" "bind mwheelup invprev;play common/talk"

alias "bhop_disasble" "bhop_disable_jump;bhop_disable_duck"

alias "bhop_enable_jump" "bind mwheeldown +jump; fps_max 32; play common/talk"
alias "bhop_enable_duck" "bind mwheelup +duck"

alias "bhop_enable" "bhop_enable_jump;bhop_enable_duck"

alias "-bhop" "bhop_disasble"
alias "+bhop" "bhop_enable"

// Alt Modifiers
alias "-alt_modifier" "-bhop"
alias "+alt_modifier" "+bhop"
bind "ALT" "+alt_modifier"

// Inspect Cancel

alias "+primary1" "slot1; +lookatweapon; -lookatweapon"
alias "-primary1" "+reload; -reload"
