// volume increase on walk (shift) (broken)
alias +Loud_Shift "+sprint; play sounds\ambient\misc\shutter7"
alias -Loud_Shift "-sprint;"
bind SHIFT +Loud_Shift

// volume increase on crouch (ctrl) (broken)
alias +Loud_Duck "+duck; play sounds/items/weapon_grenade_jumpthrow"
alias -Loud_Duck "-duck"
bind CTRL +Loud_Duck

// ALT+F4 re-enable
alias +quitbind "bind 4 quit"
alias -quitbind "unbind 4"
bind alt +quitbind;toggle_duck

// Weird inexplainable bind.
alias +awps "play weapons/ak47/ak47-1;+attack"
alias -awps "-attack"
bind "q" "+awps"

// Turning
alias +lefth "+turnleft; play buttons/blip1;"
alias -lefth "-turnleft"
bind "leftarrow" "+lefth"

alias +righth "+turnright; play buttons/blip1;"
alias -righth "-turnright"
bind "rightarrow" "+righth"

// Gamma
bind uparrow "incrementvar r_fullscreen_gamma 1 3 -0.5; play buttons/blip1"
bind downarrow "incrementvar r_fullscreen_gamma 1 3 0.5; play buttons/blip1"


// Push to Talk
alias +voic "+voicerecord; play ui/beepclear"
alias -voic "-voicerecord"
bind "v" "+voic"

